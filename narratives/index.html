<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narratives — Wim Strydom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #12100e;
  color: #e8dcc8;
  font-family: 'EB Garamond', Georgia, serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.container {
  padding: 48px 32px;
  width: 100%;
  max-width: 480px;
}

.back {
  display: block;
  font-size: 13px;
  font-style: italic;
  color: rgba(232,220,200,0.32);
  text-decoration: none;
  margin-bottom: 56px;
  transition: color 0.18s;
}
.back:hover { color: rgba(232,220,200,0.65); }

.heading {
  font-size: clamp(60px, 12vw, 108px);
  font-weight: 400;
  line-height: 1;
  color: #f0e8d4;
  margin-bottom: 64px;
  letter-spacing: -1px;
}

.stories-label {
  font-size: 11px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  opacity: 0.32;
  display: block;
  margin-bottom: 16px;
}

.divider {
  height: 1px;
  background: rgba(232,220,200,0.12);
  margin-bottom: 8px;
}

.link-list {
  list-style: none;
}

.link-list li {
  border-bottom: 1px solid rgba(232,220,200,0.07);
}

.link-list a {
  display: block;
  padding: 13px 0;
  font-size: 20px;
  line-height: 1;
  text-decoration: none;
  color: #e8dcc8;
  transition: color 0.18s;
}
.link-list a:hover { color: #c8a96e; }

.story-meta {
  font-size: 13px;
  font-style: italic;
  opacity: 0.38;
  margin-top: 3px;
  display: block;
}
</style>
</head>
<body>
<div class="container">
  <a href="../" class="back">← Wim Strydom</a>
  <h1 class="heading">Narratives</h1>
  <span class="stories-label">Stories</span>
  <div class="divider"></div>
  <ul class="link-list">
    <li>
      <a href="the-mouthpiece/">
        The Mouthpiece
        <span class="story-meta">Short Fiction · May 2026</span>
      </a>
    </li>
    <li>
      <a href="a-man-of-means-and-ends/">
        A Man of Means and Ends
        <span class="story-meta">Short Fiction · May 2026</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
