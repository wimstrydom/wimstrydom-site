<meta charset="UTF-8">

<title>Agony of Possibility — Wim Strydom</title>
<meta name="description" content="A poem by Wim Strydom.">
<meta property="og:title" content="Agony of Possibility — Wim Strydom">
<meta property="og:description" content="A poem by Wim Strydom.">

<body>

<div id="progress-bar"></div>

<header>
  <a href="../../" class="wordmark">Wim Strydom</a>
  <span class="header-date" id="header-date"></span>
</header>

<div class="page-outer" id="top">

  <nav class="rail hidden" id="rail">
    <span class="rail-label">In this poem</span>
    <div id="rail-links"></div>
    <div class="rail-divider"></div>
    <a href="../" class="rail-back">← all writing</a>
  </nav>

  <main class="content no-rail" id="content">
    <div class="state-msg" id="loading-msg">Loading…</div>
  </main>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// FRONT MATTER PARSER
// ─────────────────────────────────────────────────────────────────────────────

function parseFrontMatter(raw) {
  const meta = {};
  let body = raw;

  const fmMatch = raw.match(/^---\r?\n([\s\S]+?)\r?\n---\r?\n([\s\S]*)$/);
  if (fmMatch) {
    const yamlBlock = fmMatch[1];
    body = fmMatch[2];
    yamlBlock.split('\n').forEach(line => {
      const m = line.match(/^(\w+):\s*(.+)$/);
      if (m) meta[m[1].trim()] = m[2].trim().replace(/^["']|["']$/g, '');
    });
  }

  return { meta, body };
}

// ─────────────────────────────────────────────────────────────────────────────
// POEM RENDERER
// Groups text by 2+ blank lines (stanzas), joins lines within with <br>
// ─────────────────────────────────────────────────────────────────────────────

function renderPoem(body) {
  // Split into stanza blocks by two or more consecutive blank lines
  const stanzaBlocks = body.split(/\n{3,}/);
  let html = '';
  stanzaBlocks.forEach(block => {
    const trimmed = block.trim();
    if (!trimmed) return;
    // Lines within a stanza may be separated by single blank lines
    const lines = trimmed.split(/\n+/).map(l => l.trim()).filter(Boolean);
    if (lines.length > 0) {
      html += `<p>${lines.join('<br>')}</p>\n`;
    }
  });
  return html;
}

// ─────────────────────────────────────────────────────────────────────────────
// DATE DISPLAY
// ─────────────────────────────────────────────────────────────────────────────

function formatDate(dateStr) {
  if (!dateStr) {
    const now = new Date();
    return now.toLocaleString('en-GB', { month: 'long', year: 'numeric' });
  }
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleString('en-GB', { month: 'long', year: 'numeric' });
}

// ─────────────────────────────────────────────────────────────────────────────
// PROGRESS BAR
// ─────────────────────────────────────────────────────────────────────────────

const bar = document.getElementById('progress-bar');
function updateProgress() {
  const doc = document.documentElement;
  const scrolled = doc.scrollTop || document.body.scrollTop;
  const total = doc.scrollHeight - doc.clientHeight;
  bar.style.transform = `scaleX(${total > 0 ? scrolled / total : 0})`;
}

window.addEventListener('scroll', updateProgress, { passive: true });

// ─────────────────────────────────────────────────────────────────────────────
// LOAD AND RENDER
// ─────────────────────────────────────────────────────────────────────────────

async function loadStory(src) {
  const content = document.getElementById('content');

  let raw;
  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    raw = await res.text();
  } catch (err) {
    content.innerHTML = `
      <div class="state-msg">
        <p>Could not load <em>${src}</em>.</p>
        <p style="margin-top:12px; font-size:15px;">
          Make sure the file exists and is accessible from this page.<br>
          If you're opening this file locally, try serving it from a local server.
        </p>
      </div>`;
    document.title = 'Error — Wim Strydom';
    return;
  }

  let { meta, body } = parseFrontMatter(raw);

  // Apply defaults for this poem
  if (!meta.title)   meta.title   = 'Agony of Possibility';
  if (!meta.date)    meta.date    = '2026-05-08';
  if (!meta.eyebrow) meta.eyebrow = 'Poetry';

  // Strip a leading # Title line
  body = body.replace(/^#[^\n]*\n+/, '');

  const poemHtml = renderPoem(body);

  const pageTitle = meta.title;
  document.title = `${pageTitle} — Wim Strydom`;

  document.getElementById('header-date').textContent = formatDate(meta.date);

  const eyebrow = meta.eyebrow;
  const dateDisplay = meta.date
    ? new Date(meta.date).toLocaleString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
    : '';

  content.innerHTML = `
    <span class="page-eyebrow">${eyebrow}</span>
    <h1 class="page-title">${pageTitle}</h1>
    ${dateDisplay ? `<p class="page-meta">${dateDisplay}</p>` : ''}
    <div class="page-divider"></div>
    <div id="story-body" class="poem">${poemHtml}</div>
    <div class="story-footer">
      <a href="../" class="footer-back">← all writing</a>
      <span>Wim Strydom</span>
    </div>
  `;

  updateProgress();
}

// ─────────────────────────────────────────────────────────────────────────────
// ENTRY POINT
// ─────────────────────────────────────────────────────────────────────────────

(function init() {
  const params = new URLSearchParams(window.location.search);
  const storySrc = params.get('story') || '/narratives/agony-of-possibility/Agony_of_Possibility.md';
  loadStory(storySrc);
})();
</script>
</body>
</html>
