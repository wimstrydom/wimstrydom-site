<!--
  This page renders an uploadable Markdown file (sanitude-spec.md) via the
  narratives renderer. To publish a new version of the spec, replace
  sanitude-spec.md. Keep this top structure for the title/subtitle/version to
  render cleanly:

      ---
      version: 0.1
      date: 2026-06-16
      ---
      # Sanitude

      *Specification & Reference Implementation*

      ...body...

  The leading `# ` heading becomes the page title; the first italic-only line
  becomes the subtitle; `version` + `date` render as the meta line.
-->

<script>
// ─────────────────────────────────────────────────────────────────────────────
// MARKDOWN PARSER
// ─────────────────────────────────────────────────────────────────────────────

function parseMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let i = 0;

  function inlineFormat(text) {
    text = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => {
      const safe = u.replace(/"/g, '&quot;');
      return `<a href="${safe}">${t}</a>`;
    });

    text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    text = text.replace(/_([^_\n]+)_/g, '<em>$1</em>');
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

    return text;
  }

  function slugify(text) {
    return text
      .toLowerCase()
      .replace(/[^a-z0-9\s-]/g, '')
      .trim()
      .replace(/\s+/g, '-');
  }

  const headings = [];

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim() === '') { i++; continue; }

    const hMatch = line.match(/^(#{1,6})\s+(.+)$/);
    if (hMatch) {
      const level = hMatch[1].length;
      const text = hMatch[2].trim();
      const id = slugify(text);
      headings.push({ level, text, id });
      const tag = `h${level}`;
      html += `<${tag} id="${id}">${inlineFormat(text)}</${tag}>\n`;
      i++; continue;
    }

    if (/^(\-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
      html += '<hr>\n';
      i++; continue;
    }

    if (line.startsWith('>')) {
      let bqLines = [];
      while (i < lines.length && (lines[i].startsWith('>') || lines[i].trim() === '')) {
        bqLines.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      const inner = parseMarkdown(bqLines.join('\n')).html;
      html += `<blockquote>${inner}</blockquote>\n`;
      continue;
    }

    if (/^[\-\*\+]\s+/.test(line)) {
      html += '<ul>\n';
      while (i < lines.length && /^[\-\*\+]\s+/.test(lines[i])) {
        html += `<li>${inlineFormat(lines[i].replace(/^[\-\*\+]\s+/, ''))}</li>\n`;
        i++;
      }
      html += '</ul>\n';
      continue;
    }

    if (/^\d+\.\s+/.test(line)) {
      html += '<ol>\n';
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
        html += `<li>${inlineFormat(lines[i].replace(/^\d+\.\s+/, ''))}</li>\n`;
        i++;
      }
      html += '</ol>\n';
      continue;
    }

    if (line.startsWith('```')) {
      const lang = line.slice(3).trim();
      let codeLines = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) {
        codeLines.push(
          lines[i]
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
        );
        i++;
      }
      i++;
      html += `<pre><code${lang ? ` class="language-${lang}"` : ''}>${codeLines.join('\n')}</code></pre>\n`;
      continue;
    }

    let paraLines = [];
    while (
      i < lines.length &&
      lines[i].trim() !== '' &&
      !lines[i].match(/^#{1,6}\s/) &&
      !lines[i].startsWith('>') &&
      !lines[i].startsWith('```') &&
      !/^[\-\*\+]\s+/.test(lines[i]) &&
      !/^\d+\.\s+/.test(lines[i]) &&
      !/^(\-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim())
    ) {
      paraLines.push(lines[i]);
      i++;
    }
    if (paraLines.length > 0) {
      html += `<p>${inlineFormat(paraLines.join(' '))}</p>\n`;
    }
  }

  return { html, headings };
}

// ─────────────────────────────────────────────────────────────────────────────
// FRONT MATTER PARSER
// ─────────────────────────────────────────────────────────────────────────────

function parseFrontMatter(raw) {
  const meta = {};
  let body = raw;

  const fmMatch = raw.match(/^---\r?\n([\s\S]+?)\r?\n---\r?\n([\s\S]*)$/);
  if (fmMatch) {
    const yamlBlock = fmMatch[1];
    body = fmMatch[2];
    yamlBlock.split('\n').forEach(line => {
      const m = line.match(/^(\w+):\s*(.+)$/);
      if (m) meta[m[1].trim()] = m[2].trim().replace(/^["']|["']$/g, '');
    });
  }

  return { meta, body };
}

// ─────────────────────────────────────────────────────────────────────────────
// EXTRACT TITLE FROM CONTENT (leading # heading)
// ─────────────────────────────────────────────────────────────────────────────

function extractTitleFromBody(body) {
  const lines = body.split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim() === '') continue;
    const m = lines[i].match(/^#\s+(.+)$/);
    if (m) {
      const title = m[1].trim();
      lines.splice(i, 1);
      return { title, body: lines.join('\n') };
    }
    break;
  }
  return { title: null, body };
}

// ─────────────────────────────────────────────────────────────────────────────
// EXTRACT SUBTITLE (first italic-only paragraph)
// ─────────────────────────────────────────────────────────────────────────────

function extractSubtitle(body) {
  const lines = body.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line === '') continue;
    if (/^\*[^*].+[^*]\*$/.test(line) || /^_[^_].+[^_]_$/.test(line)) {
      const subtitle = line.replace(/^\*|\*$|^_|_$/g, '');
      lines.splice(i, 1);
      return { subtitle, body: lines.join('\n') };
    }
    break;
  }
  return { subtitle: null, body };
}

// ─────────────────────────────────────────────────────────────────────────────
// DATE DISPLAY
// ─────────────────────────────────────────────────────────────────────────────

function formatDate(dateStr) {
  if (!dateStr) {
    const now = new Date();
    return now.toLocaleString('en-GB', { month: 'long', year: 'numeric' });
  }
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleString('en-GB', { month: 'long', year: 'numeric' });
}

// ─────────────────────────────────────────────────────────────────────────────
// BUILD RAIL NAV
// ─────────────────────────────────────────────────────────────────────────────

function buildRail(headings) {
  const rail = document.getElementById('rail');
  const railLinks = document.getElementById('rail-links');
  const content = document.getElementById('content');

  const navHeadings = headings.filter(h => h.level === 2 || h.level === 3);

  if (navHeadings.length === 0) {
    rail.classList.add('hidden');
    content.classList.add('no-rail');
    return;
  }

  rail.classList.remove('hidden');
  content.classList.remove('no-rail');

  let h2Count = 0;
  navHeadings.forEach(h => {
    if (h.level === 2) h2Count++;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.className = 'rail-item' + (h.level === 3 ? ' h3' : '');
    a.dataset.id = h.id;

    if (h.level === 2) {
      const num = document.createElement('span');
      num.className = 'rail-num';
      num.textContent = String(h2Count).padStart(2, '0');
      a.appendChild(num);
    }

    const label = document.createElement('span');
    label.textContent = h.text;
    a.appendChild(label);

    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(h.id);
      if (target) {
        const top = target.getBoundingClientRect().top + window.scrollY - 82;
        window.scrollTo({ top, behavior: 'smooth' });
      }
    });

    railLinks.appendChild(a);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// ACTIVE RAIL ITEM (scroll-based)
// ─────────────────────────────────────────────────────────────────────────────

function updateRailActive() {
  const items = document.querySelectorAll('.rail-item[data-id]');
  if (!items.length) return;

  const headerH = 82;
  let activeId = null;

  items.forEach(item => {
    const el = document.getElementById(item.dataset.id);
    if (!el) return;
    const top = el.getBoundingClientRect().top;
    if (top <= headerH + 40) activeId = item.dataset.id;
  });

  items.forEach(item => {
    item.classList.toggle('active', item.dataset.id === activeId);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// PROGRESS BAR
// ─────────────────────────────────────────────────────────────────────────────

const bar = document.getElementById('progress-bar');
function updateProgress() {
  const doc = document.documentElement;
  const scrolled = doc.scrollTop || document.body.scrollTop;
  const total = doc.scrollHeight - doc.clientHeight;
  bar.style.transform = `scaleX(${total > 0 ? scrolled / total : 0})`;
}

window.addEventListener('scroll', () => {
  updateProgress();
  updateRailActive();
}, { passive: true });

// ─────────────────────────────────────────────────────────────────────────────
// LOAD AND RENDER
// ─────────────────────────────────────────────────────────────────────────────

async function loadSpec(src) {
  const content = document.getElementById('content');

  let raw;
  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    raw = await res.text();
  } catch (err) {
    content.innerHTML = `
      <div class="state-msg">
        <p>Could not load <em>${src}</em>.</p>
        <p style="margin-top:12px; font-size:15px;">
          Make sure the file exists and is accessible from this page.<br>
          If you're opening this file locally, try serving it from a local server.
        </p>
      </div>`;
    document.title = 'Error — Wim Strydom';
    return;
  }

  let { meta, body } = parseFrontMatter(raw);

  // Pull a leading "# Title" heading out of the body so it becomes the page
  // title rather than rendering inside the document.
  const extractedTitle = extractTitleFromBody(body);
  if (extractedTitle.title) {
    body = extractedTitle.body;
    if (!meta.title) meta.title = extractedTitle.title;
  }

  // Defaults for the Sanitude spec
  if (!meta.title) meta.title = 'Sanitude';
  if (!meta.eyebrow) meta.eyebrow = 'Specification';

  // Strip a leading standalone **Title** line to avoid duplicating the page title
  body = body.replace(/^\*\*[^*\n]+\*\*\n+/, '');

  if (!meta.subtitle) {
    const extracted = extractSubtitle(body);
    meta.subtitle = extracted.subtitle;
    body = extracted.body;
  }

  const { html: specHtml, headings } = parseMarkdown(body);

  const pageTitle = meta.title;
  document.title = `${pageTitle} — Specification — Wim Strydom`;

  document.getElementById('header-date').textContent = 'Book 04';

  const hasHeadings = headings.filter(h => h.level === 2 || h.level === 3).length > 0;
  buildRail(headings);

  const eyebrow = meta.eyebrow;
  const dateDisplay = meta.date
    ? new Date(meta.date).toLocaleString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
    : '';
  const metaParts = [];
  if (meta.version) metaParts.push(`Version ${meta.version}`);
  if (dateDisplay) metaParts.push(dateDisplay);
  const metaLine = metaParts.join(' · ');

  content.innerHTML = `
    <span class="page-eyebrow">${eyebrow}</span>
    <h1 class="page-title">${pageTitle}</h1>
    ${meta.subtitle ? `<p class="page-intro">${meta.subtitle}</p>` : ''}
    ${metaLine ? `<p class="page-meta">${metaLine}</p>` : ''}
    ${!hasHeadings ? '<div class="page-divider"></div>' : ''}
    <div id="spec-body" class="prose">${specHtml}</div>
    <div class="story-footer">
      <a href="../" class="footer-back">← Instruments</a>
      <span>Wim Strydom</span>
    </div>
  `;

  updateRailActive();
  updateProgress();
}

// ─────────────────────────────────────────────────────────────────────────────
// ENTRY POINT
// ─────────────────────────────────────────────────────────────────────────────

(function init() {
  const params = new URLSearchParams(window.location.search);
  const src = params.get('src') || '/instruments/sanitude-spec/sanitude-spec.md';
  loadSpec(src);
})();
</script>
