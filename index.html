<meta property="og:description" content="Personal site of Wim Strydom — philosophy, essays on space habitat design, and fiction.">

<link rel="stylesheet" href="/style.css">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  padding: 48px 32px;
  width: 100%;
  max-width: 480px;
}

.hello {
  font-size: clamp(72px, 14vw, 128px);
  font-weight: 400;
  line-height: 1;
  color: var(--ink-bright);
  margin-bottom: 64px;
  letter-spacing: -1px;
}

.contents-label {
  font-size: 11px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ink-dim);
  display: block;
  margin-bottom: 16px;
}

.divider {
  height: 1px;
  background: var(--ink-faint);
  margin-bottom: 8px;
}

.link-list {
  list-style: none;
}

.link-list li {
  border-bottom: 1px solid var(--ink-faint);
}

.link-list a,
.link-list span {
  display: block;
  padding: 13px 0;
  font-size: 20px;
  line-height: 1;
  text-decoration: none;
  transition: color 0.18s;
}

.link-list a {
  color: var(--ink);
}

.link-list a:hover {
  color: var(--gold);
}

.link-list .coming-soon {
  color: var(--ink-dim);
  font-style: italic;
  font-size: 20px;
  cursor: default;
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.coming-soon-tag {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  font-style: normal;
}
</style>
</head>
<body>
<div class="container">
  <h1 class="hello">Hello</h1>
  <span class="contents-label">Contents</span>
  <div class="divider"></div>
  <ul class="link-list">
    <li><a href="/philosophy">Philosophy</a></li>
    <li><a href="/spin-station">Spin Station</a></li>
    <li><span class="coming-soon">Roulette <span class="coming-soon-tag">coming soon</span></span></li>
    <li><a href="/narratives">Narratives</a></li>
    <li><span class="coming-soon">PF Dashboard <span class="coming-soon-tag">coming soon</span></span></li>
  </ul>
</div>
</body>
